  <style>
    #abertura{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#101D35;color:#F3F5F8;cursor:pointer;contain:strict;animation:ab-some .4s ease 10s forwards}
    #abertura.saindo{animation:ab-sai .45s ease forwards}
    #abertura::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgb(198 164 92/.16),transparent 62%);opacity:0;animation:ab-aparece .9s ease .5s forwards;will-change:opacity}
    #abertura .ab-conteudo{position:relative;display:flex;flex-direction:column;align-items:center}
    #abertura .ab-mono{position:relative;width:128px;height:112px}
    #abertura .ab-peca,#abertura .ab-peca>div{position:absolute;inset:0;will-change:transform}
    #abertura .ab-peca{overflow:hidden}
    #abertura svg{display:block;width:100%;height:100%;overflow:visible}
    /* "cortina": a janela (pai) e o desenho (filho) andam em sentidos opostos → o desenho fica parado e é revelado */
    #abertura .ab-esq{transform:translateY(-100%);animation:ab-cortina .45s cubic-bezier(.2,.7,.2,1) .1s forwards}
    #abertura .ab-esq>div{transform:translateY(100%);animation:ab-cortina .45s cubic-bezier(.2,.7,.2,1) .1s forwards}
    #abertura .ab-dir{transform:translateY(100%);animation:ab-cortina .5s cubic-bezier(.2,.7,.2,1) .4s forwards}
    #abertura .ab-dir>div{transform:translateY(-100%);animation:ab-cortina .5s cubic-bezier(.2,.7,.2,1) .4s forwards}
    #abertura .ab-filete{transform:translateX(100%);animation:ab-cortina .3s ease-out .8s forwards}
    #abertura .ab-filete>div{transform:translateX(-100%);animation:ab-cortina .3s ease-out .8s forwards}
    #abertura .ab-seta{overflow:visible;opacity:0;transform:translate(-11px,22px);animation:ab-dispara .45s cubic-bezier(.2,.9,.25,1.25) 1s forwards;will-change:transform,opacity}
    #abertura .ab-nome{margin:26px -.32em 0 0;font:600 30px/1 Montserrat,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.32em;opacity:0;transform:translateY(8px) scale(1.12);animation:ab-surge .6s cubic-bezier(.2,.7,.2,1) 1.05s forwards;will-change:transform,opacity}
    #abertura .ab-assinatura{margin:10px -.44em 0 0;font:600 10px/1 "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.44em;text-transform:uppercase;color:#C6A45C;opacity:0;animation:ab-aparece .45s ease 1.35s forwards;will-change:opacity}
    @keyframes ab-cortina{to{transform:none}}
    @keyframes ab-dispara{60%{opacity:1}to{opacity:1;transform:none}}
    @keyframes ab-surge{to{opacity:1;transform:none}}
    @keyframes ab-aparece{to{opacity:1}}
    @keyframes ab-some{to{opacity:0;visibility:hidden}}
    @keyframes ab-sai{from{opacity:1}to{opacity:0;visibility:hidden}}
    @media (prefers-reduced-motion:reduce){
      #abertura *,#abertura::before{animation-duration:.01s!important;animation-delay:0s!important}
      #abertura{animation:ab-some .3s ease 10s forwards}
      #abertura.saindo{animation:ab-sai .25s ease forwards}
    }
  </style>
